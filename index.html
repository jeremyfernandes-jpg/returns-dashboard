  <script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useCallback } = React;
const { BarChart, Bar, LineChart, Line, XAxis, YAxis, CartesianGrid,
        Tooltip, Legend, ResponsiveContainer, Cell, PieChart, Pie } = Recharts;

BarChart, Bar, LineChart, Line, XAxis, YAxis, CartesianGrid,
  Tooltip, Legend, ResponsiveContainer, Cell, PieChart, Pie
} from "recharts";

/* ─── CONSTANTS ─────────────────────────────────────────────────────────────── */
const OUTCOME_COLORS = {
  "Recommended - Not Returned": "#10b981",
  "Recommended - Returned":     "#f59e0b",
  "Non-Responsive":             "#6366f1",
  "Returned":                   "#ef4444",
};
const REASON_COLORS = {
  "IL Mill Returns":                     "#ef4444",
  "Documentation returns":               "#f59e0b",
  "Nexus":                               "#6366f1",
  "Online letter inquiry":               "#8b5cf6",
  "Verifier":                            "#3b82f6",
  "Provider related returns/responses":  "#06b6d4",
  "Profile into returns":                "#0ea5e9",
  "Service dog info":                    "#14b8a6",
  "Unmatched Names":                     "#f43f5e",
  "Pushback":                            "#84cc16",
  "Renewals":                            "#a3a3a3",
  "(unlabeled)":                         "#94a3b8",
};
const MONTH_NAMES   = {1:"Jan",2:"Feb",3:"Mar",4:"Apr",5:"May",6:"Jun",7:"Jul",8:"Aug",9:"Sep",10:"Oct",11:"Nov",12:"Dec"};
const BUCKETS_RET   = ["Recommended - Returned","Non-Responsive","Returned"];
const ALL_BUCKETS   = Object.keys(OUTCOME_COLORS);
const fmt     = n  => (n==null||isNaN(n)) ? "—" : n >= 1000 ? (n/1000).toFixed(1)+"k" : String(n);
const fmtFull = n  => (n==null||isNaN(n)) ? "—" : Number(n).toLocaleString();

/* ─── CSV PARSER — returns array of plain objects with UPPER_CASE keys ──────── */
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) throw new Error("File appears empty");
  const headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, "").toUpperCase());
  const rows = [];
  for (let li = 1; li < lines.length; li++) {
    const line = lines[li];
    if (!line.trim()) continue;
    const vals = [];
    let cur = "", inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if      (ch === '"')            inQ = !inQ;
      else if (ch === ',' && !inQ)  { vals.push(cur); cur = ""; }
      else                            cur += ch;
    }
    vals.push(cur);
    const obj = {};
    headers.forEach((h, i) => {
      const raw = (vals[i] ?? "").trim().replace(/^"|"$/g, "");
      if (raw === "" || raw.toLowerCase() === "null") { obj[h] = null; return; }
      if (raw.toLowerCase() === "true")               { obj[h] = true; return; }
      if (raw.toLowerCase() === "false")              { obj[h] = false; return; }
      const num = Number(raw);
      obj[h] = isNaN(num) ? raw : num;
    });
    rows.push(obj);
  }
  return rows;
}

/* ─── CORE DATA PROCESSOR ────────────────────────────────────────────────────── */
function processData(casesRaw, rrRaw, assistFilter = "all") {
  // 1. Deduplicate cases to one row per PET_ID
  const caseMap = {};
  for (const r of casesRaw) {
    const id = r.PET_ID;
    if (!id) continue;
    if (!caseMap[id]) {
      const raw = (r.PET_ASSISTANCE_TYPE ?? "").toLowerCase();
      caseMap[id] = {
        id,
        status:     r.PET_STATUS ?? "",
        ret:        r.RETURNEDANIMALS       ?? 0,
        ptb:        r.PROCESSINGTIMEBUCKET  ?? 0,
        dwu:        r.DAYS_WITH_USER        ?? 0,
        month:      r.SUBMITTEDMONTH        ?? 0,
        assistType: raw === "service" ? "service" : raw === "support" ? "support" : "other",
      };
    } else {
      const c = caseMap[id];
      c.ret = Math.max(c.ret, r.RETURNEDANIMALS  ?? 0);
      c.ptb = Math.max(c.ptb, r.PROCESSINGTIMEBUCKET ?? 0);
      c.dwu = Math.max(c.dwu, r.DAYS_WITH_USER   ?? 0);
    }
  }

  // 2. Assign outcome bucket
  for (const c of Object.values(caseMap)) {
    if      (c.status === "recommended"   && c.ret === 0) c.bucket = "Recommended - Not Returned";
    else if (c.status === "recommended"   && c.ret >= 1) c.bucket = "Recommended - Returned";
    else if (c.status === "non_responsive")               c.bucket = "Non-Responsive";
    else if (c.status === "returned")                     c.bucket = "Returned";
    else                                                  c.bucket = "Other";
  }
  const allCases = Object.values(caseMap);
  // Apply assistance type filter
  const cases = assistFilter === "all"
    ? allCases
    : allCases.filter(c => c.assistType === assistFilter);

  // 3. Reason group remapping rules — applied when RETURN_REASON_GROUP is blank
  // Priority order: first match wins. Patterns are case-insensitive substrings.
  const REMAP_RULES = [
    ["IL Mill Returns",       ["Confirmed IL Mill","IL First Return","Brainy.*Unsuccessful","Multiple Unsuccessful.*Brainy"]],
    ["Nexus",                 ["Gen Nexus","General nexus","Nexus 2","Disability.*General Nexus","Need specificity","Outdated.*Nexus","ID/Cert.*Nexus","No Doc.*Nexus","Need.*Nexus","Service nexus","Jacob","Nexus Expired","Nex not Met","Expired.*Nex","Service Nexus is Bad","Task specificity"]],
    ["Documentation returns", ["^Outdated$","Both Certificate","Expired Letter","Insufficient documentation","No documentation","^Expired document$","Outdated but will try","Blurry","ID Photo Instead","Insuff\\. Determination","Letter for 1 Animal used for Multiple","Multiple Animals Letter","No Rabies Vax","Vaccination Exempt","Expired Rabies","Self Administered Rabies","No Vaccine Needed","^DOB$"]],
    ["Verifier",              ["Verification Pending","No Response from Provider","Provider Wants Req","ROI when office","ROI Breakdown","ROI needed when","Spring Eternal","Provider No Longer","Provider Said Verification","Provider Contact Info","Letter Too Old to Verify","International Email","Direct Contact Needed","Direct email language","LifeStance","ROI Explanation","Address.*Last 4","Uncertain if ROI"]],
    ["Profile into returns",  ["Support Or HHP","Switch to Pet","Switch profile","Duplicate Profile","Duplicates Across Multiple","No Housing Provider","No PM Linked","NLPS is the ONLY","No Patient Name","Other.*Profile Type","Animal For Someone Not In Home"]],
    ["Unmatched Names",       ["Unmatched Names","Unmatched Last Names","Animal Names Unmatched","Umatched Name","Animal Types Unmatched"]],
    ["Service dog info",      ["Dog Under 4 Months","Retired Service Animal","Proceed with Single Animal","Bonded Animals","Disclosed Bite"]],
    ["Pushback",              ["NR Final Warning","Florida Statute","Understanding the Verification Process","Questions for non-California"]],
  ];

  function remapGroup(grp, detail) {
    // If already labeled, keep it
    if (grp && grp.trim()) return grp.trim();
    // No detail text — truly blank
    if (!detail || !detail.trim()) return "(unlabeled)";
    const d = detail.trim();
    for (const [group, patterns] of REMAP_RULES) {
      for (const pat of patterns) {
        try {
          if (new RegExp(pat, "i").test(d)) return group;
        } catch(e) {
          if (d.toLowerCase().includes(pat.toLowerCase())) return group;
        }
      }
    }
    return "(unlabeled)";
  }

  // 4. Reason groups per PET_ID (Set — distinct mapped groups per case)
  const reasonMap = {};
  for (const r of rrRaw) {
    const id  = r.PET_ID;
    if (!id) continue;
    const grp = remapGroup(r.RETURN_REASON_GROUP, r.RETURN_REASONS);
    if (!reasonMap[id]) reasonMap[id] = new Set();
    reasonMap[id].add(grp);
  }

  // 4. Months
  const months = [...new Set(cases.map(c => c.month).filter(Boolean))].sort((a,b)=>a-b);

  // 5. KPI totals
  const kpi = {};
  ALL_BUCKETS.forEach(b => kpi[b] = 0);
  cases.forEach(c => { if (kpi[c.bucket] !== undefined) kpi[c.bucket]++; });
  const grand = ALL_BUCKETS.reduce((s,b) => s + kpi[b], 0);

  // 6. Monthly volume trend
  const trendData = months.map(m => {
    const mc = cases.filter(c => c.month === m);
    const obj = { month: MONTH_NAMES[m] ?? `M${m}` };
    ALL_BUCKETS.forEach(b => obj[b] = mc.filter(c => c.bucket === b).length);
    const tot = ALL_BUCKETS.reduce((s,b) => s + obj[b], 0);
    ALL_BUCKETS.forEach(b => obj[b+"_pct"] = tot ? +((obj[b]/tot)*100).toFixed(1) : 0);
    return obj;
  });

  // 7. Monthly processing time
  const ptbData = months.map(m => {
    const mc = cases.filter(c => c.month === m);
    const obj = { month: MONTH_NAMES[m] ?? `M${m}` };
    ALL_BUCKETS.forEach(b => {
      const bc = mc.filter(c => c.bucket === b);
      obj[b+"_ptb"] = bc.length ? +(bc.reduce((s,c)=>s+c.ptb,0)/bc.length).toFixed(1) : null;
      obj[b+"_dwu"] = bc.length ? +(bc.reduce((s,c)=>s+c.dwu,0)/bc.length).toFixed(1) : null;
    });
    return obj;
  });

  // 8. YTD reason breakdown per returned bucket (distinct cases per group)
  const reasonByBucket = {};
  BUCKETS_RET.forEach(b => reasonByBucket[b] = {});
  cases.forEach(c => {
    if (!BUCKETS_RET.includes(c.bucket)) return;
    const grps = reasonMap[c.id];
    if (!grps || !grps.size) {
      reasonByBucket[c.bucket]["(unlabeled)"] = (reasonByBucket[c.bucket]["(unlabeled)"] ?? 0) + 1;
    } else {
      grps.forEach(g => {
        reasonByBucket[c.bucket][g] = (reasonByBucket[c.bucket][g] ?? 0) + 1;
      });
    }
  });

  // 9. Top reason groups (combined across returned buckets) for trend chart
  const allGrpCounts = {};
  BUCKETS_RET.forEach(b => {
    Object.entries(reasonByBucket[b]).forEach(([g,n]) => {
      allGrpCounts[g] = (allGrpCounts[g] ?? 0) + n;
    });
  });
  const topGroups = Object.entries(allGrpCounts).sort((a,b)=>b[1]-a[1]).slice(0,7).map(([g])=>g);

  // 10. Reason group monthly trend
  const reasonTrend = months.map(m => {
    const obj = { month: MONTH_NAMES[m] ?? `M${m}` };
    topGroups.forEach(g => {
      obj[g] = cases.filter(c =>
        c.month === m &&
        BUCKETS_RET.includes(c.bucket) &&
        (reasonMap[c.id]?.has(g) || (!reasonMap[c.id] && g === "(unlabeled)"))
      ).length;
    });
    return obj;
  });

  return { cases, months, kpi, grand, trendData, ptbData, reasonByBucket, topGroups, reasonTrend, reasonMap };
}

/* ─── UPLOAD DROP ZONE ───────────────────────────────────────────────────────── */
function DropZone({ label, hint, color, loaded, onFile }) {
  const ref  = useRef();
  const [drag, setDrag] = useState(false);
  const pick = useCallback(e => {
    e.preventDefault(); setDrag(false);
    const f = e.dataTransfer?.files?.[0] ?? e.target?.files?.[0];
    if (f) onFile(f);
  }, [onFile]);
  return (
    <div
      onClick={() => ref.current.click()}
      onDragOver={e => { e.preventDefault(); setDrag(true); }}
      onDragLeave={() => setDrag(false)}
      onDrop={pick}
      style={{
        border: `2px dashed ${loaded ? color : drag ? "#3b82f6" : "#334155"}`,
        borderRadius: 12, padding: "32px 20px", textAlign: "center", cursor: "pointer",
        background: loaded ? `${color}18` : drag ? "rgba(59,130,246,.06)" : "#0f172a",
        transition: "all .2s",
      }}
    >
      <input ref={ref} type="file" accept=".csv" style={{display:"none"}} onChange={pick} />
      <div style={{fontSize:32,marginBottom:8}}>{loaded ? "✅" : "📄"}</div>
      <div style={{fontSize:13,fontWeight:700,color: loaded ? color : "#e2e8f0",marginBottom:4}}>{label}</div>
      <div style={{fontSize:11,color:"#64748b"}}>{loaded ? "Loaded — click to replace" : hint}</div>
    </div>
  );
}

/* ─── SHARED TOOLTIP ─────────────────────────────────────────────────────────── */
function Tip({ active, payload, label, isPct }) {
  if (!active || !payload?.length) return null;
  return (
    <div style={{background:"#0f172a",border:"1px solid #334155",borderRadius:8,padding:"10px 14px",fontSize:12,color:"#e2e8f0",minWidth:190}}>
      <div style={{fontWeight:700,marginBottom:6,color:"#94a3b8"}}>{label}</div>
      {payload.map((p, i) => (
        <div key={i} style={{display:"flex",justifyContent:"space-between",gap:16,marginBottom:2}}>
          <span style={{color: p.color || p.fill || "#94a3b8"}}>{p.name}</span>
          <span style={{fontWeight:600}}>{isPct ? p.value+"%" : fmtFull(p.value)}</span>
        </div>
      ))}
    </div>
  );
}

/* ─── ROOT APP ───────────────────────────────────────────────────────────────── */
function App() {
  const [casesRaw,  setCasesRaw]  = useState(null);
  const [rrRaw,     setRrRaw]     = useState(null);
  const [casesName, setCasesName] = useState("");
  const [rrName,    setRrName]    = useState("");
  const [status,    setStatus]    = useState({ cases: "idle", rr: "idle" }); // idle|loading|done|error
  const [errors,    setErrors]    = useState({ cases: "", rr: "" });
  const [tab,       setTab]       = useState("overview");
  const [volMode,   setVolMode]   = useState("count");
  const [selBucket, setSelBucket] = useState("All");
  const [assistFilter, setAssistFilter] = useState("all"); // "all" | "support" | "service"

  /* file loader */
  const loadFile = useCallback((file, which) => {
    setStatus(s => ({...s, [which]:"loading"}));
    setErrors(e => ({...e, [which]:""}));
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const rows = parseCSV(ev.target.result);
        if (which === "cases") { setCasesRaw(rows); setCasesName(file.name); }
        else                   { setRrRaw(rows);    setRrName(file.name);    }
        setStatus(s => ({...s, [which]:"done"}));
      } catch(err) {
        setErrors(e => ({...e, [which]: err.message}));
        setStatus(s => ({...s, [which]:"error"}));
      }
    };
    reader.onerror = () => {
      setErrors(e => ({...e, [which]:"Could not read file"}));
      setStatus(s => ({...s, [which]:"error"}));
    };
    reader.readAsText(file);
  }, []);

  /* process data only when both files ready */
  const data = useMemo(() => {
    if (!casesRaw || !rrRaw) return null;
    try { return processData(casesRaw, rrRaw, assistFilter); }
    catch(e) { console.error("processData error:", e); return null; }
  }, [casesRaw, rrRaw, assistFilter]);

  /* styles */
  const card = { background:"#1e293b", borderRadius:12, padding:"20px 24px", border:"1px solid #334155" };
  const tabStyle = t => ({
    padding:"8px 20px", borderRadius:8, border:"none", cursor:"pointer", fontSize:13, fontWeight:600,
    background: tab===t ? "#3b82f6" : "transparent",
    color:      tab===t ? "#fff"    : "#94a3b8",
    transition:"all .15s",
  });
  const togStyle = (v, cur) => ({
    padding:"5px 14px", borderRadius:6, border:"none", cursor:"pointer", fontSize:12, fontWeight:600,
    background: cur===v ? "#3b82f6" : "transparent",
    color:      cur===v ? "#fff"    : "#64748b",
  });

  /* ── UPLOAD SCREEN ── */
  if (!data) {
    return (
      <div style={{minHeight:"100vh",background:"#0b1222",color:"#e2e8f0",fontFamily:"'DM Sans',system-ui,sans-serif",display:"flex",alignItems:"center",justifyContent:"center",padding:32}}>
        <div style={{width:"100%",maxWidth:600}}>
          <div style={{textAlign:"center",marginBottom:36}}>
            <div style={{fontSize:11,letterSpacing:3,color:"#3b82f6",fontWeight:700,textTransform:"uppercase",marginBottom:8}}>Returns Analysis Dashboard</div>
            <h1 style={{margin:"0 0 10px",fontSize:26,fontWeight:800,color:"#f1f5f9",letterSpacing:"-0.5px"}}>Upload your two CSV files</h1>
            <p style={{margin:0,fontSize:13,color:"#64748b",lineHeight:1.7}}>
              Drop in <strong style={{color:"#94a3b8"}}>2026_YTD_Cases.csv</strong> and{" "}
              <strong style={{color:"#94a3b8"}}>2026_YTD_Return_Reasons.csv</strong>.<br/>
              All processing happens locally — nothing is sent anywhere.
            </p>
          </div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:20}}>
            <DropZone label="Cases File" hint="2026_YTD_Cases.csv" color="#10b981"
              loaded={status.cases==="done"} onFile={f=>loadFile(f,"cases")}/>
            <DropZone label="Return Reasons File" hint="2026_YTD_Return_Reasons.csv" color="#f59e0b"
              loaded={status.rr==="done"} onFile={f=>loadFile(f,"rr")}/>
          </div>

          {/* status messages */}
          {["cases","rr"].map(which => {
            const st = status[which], er = errors[which];
            const name = which==="cases" ? casesName : rrName;
            const rows = which==="cases" ? casesRaw  : rrRaw;
            if (st==="loading") return <div key={which} style={{textAlign:"center",color:"#64748b",fontSize:13,marginBottom:6}}>Reading {which==="cases"?"Cases":"Return Reasons"} file…</div>;
            if (st==="error")   return <div key={which} style={{color:"#f87171",fontSize:12,background:"rgba(239,68,68,.08)",padding:"8px 14px",borderRadius:8,border:"1px solid rgba(239,68,68,.2)",marginBottom:6}}>{er}</div>;
            if (st==="done")    return <div key={which} style={{color:"#6ee7b7",fontSize:12,textAlign:"center",marginBottom:6}}>✅ {name} — {rows?.length?.toLocaleString()} rows loaded</div>;
            return null;
          })}

          {casesRaw && !rrRaw && status.rr!=="loading" &&
            <div style={{textAlign:"center",fontSize:12,color:"#64748b",marginTop:4}}>Now upload the Return Reasons file to continue →</div>}
          {!casesRaw && rrRaw && status.cases!=="loading" &&
            <div style={{textAlign:"center",fontSize:12,color:"#64748b",marginTop:4}}>Now upload the Cases file to continue →</div>}

          <div style={{marginTop:28,padding:"14px 18px",background:"#1e293b",borderRadius:10,border:"1px solid #334155",fontSize:11,color:"#475569",lineHeight:1.8}}>
            <strong style={{color:"#64748b"}}>Cases file needs:</strong> PET_ID, PET_STATUS, SUBMITTEDMONTH, PROCESSINGTIMEBUCKET, DAYS_WITH_USER, RETURNEDANIMALS<br/>
            <strong style={{color:"#64748b"}}>Return Reasons file needs:</strong> PET_ID, RETURN_REASON_GROUP
          </div>
        </div>
      </div>
    );
  }

  /* ── DASHBOARD ── */
  const { kpi, grand, trendData, ptbData, reasonByBucket, topGroups, reasonTrend } = data;

  const bucketBarData = ALL_BUCKETS.map(b => ({ name:b, value: kpi[b]??0 }));

  const reasonRows = selBucket === "All"
    ? (() => {
        const m = {};
        BUCKETS_RET.forEach(b => Object.entries(reasonByBucket[b]??{}).forEach(([g,n]) => { m[g]=(m[g]??0)+n; }));
        return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([name,value])=>({name,value}));
      })()
    : Object.entries(reasonByBucket[selBucket]??{}).sort((a,b)=>b[1]-a[1]).map(([name,value])=>({name,value}));

  const bucketScope = selBucket==="All"
    ? BUCKETS_RET.reduce((s,b)=>s+(kpi[b]??0),0)
    : (kpi[selBucket]??0);

  return (
    <div style={{minHeight:"100vh",background:"#0b1222",color:"#e2e8f0",fontFamily:"'DM Sans',system-ui,sans-serif",padding:"22px 26px"}}>

      {/* HEADER */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:22}}>
        <div>
          <div style={{fontSize:10,letterSpacing:3,color:"#3b82f6",fontWeight:700,textTransform:"uppercase",marginBottom:3}}>YTD Performance</div>
          <h1 style={{margin:0,fontSize:22,fontWeight:800,color:"#f1f5f9",letterSpacing:"-0.5px"}}>Returns Analysis Dashboard</h1>
          <div style={{fontSize:11,color:"#64748b",marginTop:3}}>{casesName} · {rrName} · {fmtFull(grand)} unique cases · {data.months.length} months</div>
        </div>
        <button onClick={()=>{setCasesRaw(null);setRrRaw(null);setStatus({cases:"idle",rr:"idle"});setErrors({cases:"",rr:""});}} style={{
          background:"#1e293b",color:"#94a3b8",border:"1px solid #334155",borderRadius:8,
          padding:"7px 14px",fontSize:12,fontWeight:600,cursor:"pointer"
        }}>⬆ Reload Files</button>
      </div>

      {/* ASSIST TYPE FILTER */}
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20,padding:"10px 16px",background:"#1e293b",borderRadius:10,border:"1px solid #334155",width:"fit-content"}}>
        <span style={{fontSize:10,color:"#64748b",fontWeight:700,textTransform:"uppercase",letterSpacing:1}}>Animal Type</span>
        {[
          {val:"all",     label:"All Types"},
          {val:"support", label:"🐾 Support"},
          {val:"service", label:"🦮 Service"},
        ].map(({val,label})=>(
          <button key={val} onClick={()=>setAssistFilter(val)} style={{
            padding:"5px 16px", borderRadius:7, border:"1px solid", cursor:"pointer", fontSize:12, fontWeight:700,
            borderColor: assistFilter===val ? "#3b82f6" : "#334155",
            background:  assistFilter===val ? "rgba(59,130,246,.15)" : "transparent",
            color:       assistFilter===val ? "#60a5fa" : "#94a3b8",
            transition:  "all .15s",
          }}>{label}</button>
        ))}
        {assistFilter !== "all" && (
          <span style={{fontSize:11,color:"#64748b",marginLeft:4}}>
            Showing <strong style={{color:"#e2e8f0"}}>{fmtFull(grand)}</strong> {assistFilter} cases
          </span>
        )}
      </div>

      {/* KPI CARDS */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:20}}>
        {[
          {label:"Recommended (Clean)",    bucket:"Recommended - Not Returned", icon:"✓"},
          {label:"Recommended (Returned)", bucket:"Recommended - Returned",      icon:"↩"},
          {label:"Non-Responsive",         bucket:"Non-Responsive",              icon:"◌"},
          {label:"Returned",               bucket:"Returned",                    icon:"✕"},
        ].map(({label,bucket,icon}) => {
          const n   = kpi[bucket]??0;
          const pct = grand ? (100*n/grand).toFixed(1) : 0;
          const col = OUTCOME_COLORS[bucket];
          return (
            <div key={bucket} style={{...card,borderLeft:`3px solid ${col}`}}>
              <div style={{fontSize:10,color:"#64748b",fontWeight:600,textTransform:"uppercase",letterSpacing:1,marginBottom:5}}>{icon} {label}</div>
              <div style={{fontSize:26,fontWeight:800,color:col,letterSpacing:"-1px"}}>{fmt(n)}</div>
              <div style={{fontSize:11,color:"#94a3b8",marginTop:2}}>{pct}% of total volume</div>
            </div>
          );
        })}
      </div>

      {/* TABS */}
      <div style={{display:"flex",gap:3,marginBottom:16,background:"#1e293b",padding:4,borderRadius:10,width:"fit-content",border:"1px solid #334155"}}>
        {[["overview","Overview"],["reasons","Return Reasons"],["trend","Monthly Trend"]].map(([t,l])=>(
          <button key={t} style={tabStyle(t)} onClick={()=>setTab(t)}>{l}</button>
        ))}
      </div>

      {/* ── OVERVIEW ── */}
      {tab==="overview" && (
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
          <div style={card}>
            <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",marginBottom:14,textTransform:"uppercase",letterSpacing:1}}>Volume by Outcome Bucket (YTD)</div>
            <ResponsiveContainer width="100%" height={230}>
              <BarChart data={bucketBarData} layout="vertical" margin={{left:8,right:28}}>
                <CartesianGrid strokeDasharray="3 3" stroke="#1e3a5f" horizontal={false}/>
                <XAxis type="number" tickFormatter={fmt} tick={{fill:"#64748b",fontSize:11}} axisLine={false} tickLine={false}/>
                <YAxis type="category" dataKey="name" width={185} tick={{fill:"#94a3b8",fontSize:11}} axisLine={false} tickLine={false}/>
                <Tooltip content={p=><Tip {...p}/>}/>
                <Bar dataKey="value" name="Cases" radius={[0,6,6,0]}>
                  {bucketBarData.map((e,i)=><Cell key={i} fill={OUTCOME_COLORS[e.name]}/>)}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>
          <div style={card}>
            <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",marginBottom:14,textTransform:"uppercase",letterSpacing:1}}>% Share of Total Volume</div>
            <ResponsiveContainer width="100%" height={230}>
              <PieChart>
                <Pie data={bucketBarData} dataKey="value" nameKey="name" cx="50%" cy="50%"
                  innerRadius={60} outerRadius={95} paddingAngle={3}
                  label={({percent})=>`${(percent*100).toFixed(1)}%`} labelLine={false}>
                  {bucketBarData.map((e,i)=><Cell key={i} fill={OUTCOME_COLORS[e.name]}/>)}
                </Pie>
                <Tooltip content={p=><Tip {...p}/>}/>
                <Legend formatter={v=><span style={{fontSize:11,color:"#94a3b8"}}>{v}</span>}/>
              </PieChart>
            </ResponsiveContainer>
          </div>
        </div>
      )}

      {/* ── RETURN REASONS ── */}
      {tab==="reasons" && (
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
          {/* filter bar */}
          <div style={{...card,gridColumn:"1/-1",padding:"11px 16px",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <span style={{fontSize:10,color:"#64748b",fontWeight:700,textTransform:"uppercase",letterSpacing:1}}>Filter by bucket</span>
            {["All",...BUCKETS_RET].map(b=>(
              <button key={b} onClick={()=>setSelBucket(b)} style={{
                padding:"4px 12px",borderRadius:6,border:"1px solid",cursor:"pointer",fontSize:12,fontWeight:600,
                borderColor: selBucket===b?(OUTCOME_COLORS[b]||"#3b82f6"):"#334155",
                background:  selBucket===b?"rgba(59,130,246,.1)":"transparent",
                color:       selBucket===b?(OUTCOME_COLORS[b]||"#3b82f6"):"#94a3b8",
              }}>{b}</button>
            ))}
            <span style={{marginLeft:"auto",fontSize:11,color:"#64748b"}}>{fmtFull(bucketScope)} cases in scope</span>
          </div>

          {/* bar chart */}
          <div style={card}>
            <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",marginBottom:3,textTransform:"uppercase",letterSpacing:1}}>Cases by Reason Group</div>
            <div style={{fontSize:10,color:"#475569",marginBottom:12}}>Distinct cases · multi-reason cases counted under each group</div>
            <ResponsiveContainer width="100%" height={310}>
              <BarChart data={reasonRows} layout="vertical" margin={{left:8,right:28}}>
                <CartesianGrid strokeDasharray="3 3" stroke="#1e3a5f" horizontal={false}/>
                <XAxis type="number" tickFormatter={fmt} tick={{fill:"#64748b",fontSize:11}} axisLine={false} tickLine={false}/>
                <YAxis type="category" dataKey="name" width={195} tick={{fill:"#94a3b8",fontSize:10}} axisLine={false} tickLine={false}/>
                <Tooltip content={p=><Tip {...p}/>}/>
                <Bar dataKey="value" name="Cases" radius={[0,5,5,0]}>
                  {reasonRows.map((e,i)=><Cell key={i} fill={REASON_COLORS[e.name]||"#3b82f6"}/>)}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>

          {/* % progress bars */}
          <div style={card}>
            <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",marginBottom:14,textTransform:"uppercase",letterSpacing:1}}>% of Bucket Volume</div>
            <div style={{display:"flex",flexDirection:"column",gap:10,maxHeight:330,overflowY:"auto"}}>
              {reasonRows.map((r,i)=>{
                const pct = bucketScope ? (100*r.value/bucketScope).toFixed(1) : 0;
                const col = REASON_COLORS[r.name]||"#3b82f6";
                return (
                  <div key={i}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}>
                      <span style={{color:r.name==="(unlabeled)"?"#f97316":"#cbd5e1"}}>{r.name}{r.name==="(unlabeled)"?" ⚠":""}</span>
                      <span style={{fontWeight:700,color:col}}>{pct}% · {fmtFull(r.value)}</span>
                    </div>
                    <div style={{height:4,background:"#1e3a5f",borderRadius:4}}>
                      <div style={{height:4,background:col,borderRadius:4,width:`${Math.min(pct,100)}%`,transition:"width .4s"}}/>
                    </div>
                  </div>
                );
              })}
            </div>
            {reasonRows.some(r=>r.name==="(unlabeled)") && (
              <div style={{marginTop:12,padding:"8px 12px",background:"rgba(249,115,22,.08)",borderRadius:6,border:"1px solid rgba(249,115,22,.2)",fontSize:11,color:"#fb923c"}}>
            ⚠ Remaining unlabeled cases have no reason text recorded in the source data — these cannot be classified further without upstream data fixes.
              </div>
            )}
          </div>

          {/* reason trend stacked */}
          <div style={{...card,gridColumn:"1/-1"}}>
            <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",marginBottom:3,textTransform:"uppercase",letterSpacing:1}}>Top Reason Groups — Monthly Trend (All Returned Buckets)</div>
            <div style={{fontSize:10,color:"#475569",marginBottom:14}}>Stacked · distinct cases per group per month</div>
            <ResponsiveContainer width="100%" height={220}>
              <BarChart data={reasonTrend} margin={{left:0,right:8}}>
                <CartesianGrid strokeDasharray="3 3" stroke="#1e3a5f" vertical={false}/>
                <XAxis dataKey="month" tick={{fill:"#64748b",fontSize:11}} axisLine={false} tickLine={false}/>
                <YAxis tickFormatter={fmt} tick={{fill:"#64748b",fontSize:11}} axisLine={false} tickLine={false}/>
                <Tooltip content={p=><Tip {...p}/>}/>
                <Legend formatter={v=><span style={{fontSize:10,color:"#94a3b8"}}>{v}</span>}/>
                {topGroups.map(g=>(
                  <Bar key={g} dataKey={g} stackId="a" fill={REASON_COLORS[g]||"#3b82f6"}/>
                ))}
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>
      )}

      {/* ── MONTHLY TREND ── */}
      {tab==="trend" && (
        <div style={{display:"grid",gap:16}}>

          {/* volume with toggle */}
          <div style={card}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
              <div>
                <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:1}}>Monthly Volume by Outcome Bucket</div>
                <div style={{fontSize:10,color:"#475569",marginTop:2}}>
                  {volMode==="pct" ? "% of total monthly cases — compare bucket share apples-to-apples" : "Raw unique case counts per month"}
                </div>
              </div>
              <div style={{display:"flex",background:"#0f172a",borderRadius:8,border:"1px solid #334155",padding:3,gap:2,flexShrink:0}}>
                {[["count","# Cases"],["pct","% Share"]].map(([v,l])=>(
                  <button key={v} onClick={()=>setVolMode(v)} style={togStyle(v,volMode)}>{l}</button>
                ))}
              </div>
            </div>
            <ResponsiveContainer width="100%" height={270}>
              <LineChart data={trendData} margin={{left:0,right:18,top:8}}>
                <CartesianGrid strokeDasharray="3 3" stroke="#1e3a5f" vertical={false}/>
                <XAxis dataKey="month" tick={{fill:"#64748b",fontSize:11}} axisLine={false} tickLine={false}/>
                <YAxis tickFormatter={v=>volMode==="pct"?v+"%":fmt(v)} tick={{fill:"#64748b",fontSize:11}} axisLine={false} tickLine={false} domain={volMode==="pct"?[0,100]:["auto","auto"]}/>
                <Tooltip content={p=><Tip {...p} isPct={volMode==="pct"}/>}/>
                <Legend formatter={v=><span style={{fontSize:11,color:"#94a3b8"}}>{v}</span>}/>
                {ALL_BUCKETS.map(b=>(
                  <Line key={b} type="monotone" dataKey={volMode==="pct"?b+"_pct":b} name={b}
                    stroke={OUTCOME_COLORS[b]} strokeWidth={2.5} dot={{r:4,fill:OUTCOME_COLORS[b]}} activeDot={{r:6}}/>
                ))}
              </LineChart>
            </ResponsiveContainer>
          </div>

          {/* processing time bars + DWU line overlay */}
          <div style={card}>
            <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",marginBottom:2,textTransform:"uppercase",letterSpacing:1}}>Avg Processing Time by Outcome — Monthly</div>
            <div style={{fontSize:10,color:"#475569",marginBottom:10}}>Bars = Avg Processing Time Bucket (total cycle) &nbsp;·&nbsp; Dashed lines = Avg Days With User (outside your control)</div>
            <div style={{display:"flex",gap:14,marginBottom:12,flexWrap:"wrap"}}>
              {ALL_BUCKETS.map(b=>(
                <div key={b} style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:"#94a3b8"}}>
                  <div style={{width:10,height:10,background:OUTCOME_COLORS[b],borderRadius:2,flexShrink:0}}/>
                  {b}
                </div>
              ))}
              <div style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:"#94a3b8"}}>
                <svg width="18" height="8"><line x1="0" y1="4" x2="18" y2="4" stroke="#94a3b8" strokeWidth="2" strokeDasharray="4 2"/></svg>
                Days With User (overlay)
              </div>
            </div>
            <ResponsiveContainer width="100%" height={270}>
              <BarChart data={ptbData} margin={{left:0,right:18,top:5}}>
                <CartesianGrid strokeDasharray="3 3" stroke="#1e3a5f" vertical={false}/>
                <XAxis dataKey="month" tick={{fill:"#64748b",fontSize:11}} axisLine={false} tickLine={false}/>
                <YAxis yAxisId="l" tickFormatter={v=>v+"d"} tick={{fill:"#64748b",fontSize:11}} axisLine={false} tickLine={false}/>
                <YAxis yAxisId="r" orientation="right" tickFormatter={v=>v+"d"} tick={{fill:"#64748b",fontSize:11}} axisLine={false} tickLine={false}/>
                <Tooltip content={({active,payload,label})=>{
                  if(!active||!payload?.length) return null;
                  const ptbs = payload.filter(p=>String(p.dataKey).endsWith("_ptb"));
                  const dwus = payload.filter(p=>String(p.dataKey).endsWith("_dwu"));
                  return (
                    <div style={{background:"#0f172a",border:"1px solid #334155",borderRadius:8,padding:"10px 14px",fontSize:12,color:"#e2e8f0",minWidth:230}}>
                      <div style={{fontWeight:700,marginBottom:6,color:"#94a3b8"}}>{label}</div>
                      {ptbs.length > 0 && <div style={{color:"#475569",fontSize:10,marginBottom:3,textTransform:"uppercase",letterSpacing:1}}>Avg Processing Time Bucket</div>}
                      {ptbs.map((p,i)=>{ const b=String(p.dataKey).replace("_ptb",""); return(
                        <div key={i} style={{display:"flex",justifyContent:"space-between",gap:16,marginBottom:2}}>
                          <span style={{color:OUTCOME_COLORS[b]||"#94a3b8"}}>{b}</span><span style={{fontWeight:600}}>{p.value}d</span>
                        </div>);
                      })}
                      {dwus.length > 0 && <div style={{color:"#475569",fontSize:10,margin:"6px 0 3px",textTransform:"uppercase",letterSpacing:1}}>Avg Days With User</div>}
                      {dwus.map((p,i)=>{ const b=String(p.dataKey).replace("_dwu",""); return(
                        <div key={i} style={{display:"flex",justifyContent:"space-between",gap:16,marginBottom:2}}>
                          <span style={{color:OUTCOME_COLORS[b]||"#94a3b8"}}>{b}</span><span style={{fontWeight:600}}>{p.value}d</span>
                        </div>);
                      })}
                    </div>
                  );
                }}/>
                {ALL_BUCKETS.map(b=>(
                  <Bar key={b+"_ptb"} yAxisId="l" dataKey={b+"_ptb"} name={b} fill={OUTCOME_COLORS[b]} opacity={0.85} radius={[3,3,0,0]}/>
                ))}
                {ALL_BUCKETS.map(b=>(
                  <Line key={b+"_dwu"} yAxisId="r" type="monotone" dataKey={b+"_dwu"} name={b+" (DwU)"}
                    stroke={OUTCOME_COLORS[b]} strokeWidth={2} strokeDasharray="5 3"
                    dot={{r:3,fill:OUTCOME_COLORS[b]}} connectNulls/>
                ))}
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>
      )}

      <div style={{marginTop:18,fontSize:10,color:"#334155",textAlign:"center"}}>
        Distinct cases per reason group · Multi-reason cases counted under each group · % of bucket may sum &gt;100%
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
